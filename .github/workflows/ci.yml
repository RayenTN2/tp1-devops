name: CI Pipeline

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate_files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Vérifier la présence des fichiers de fonctionnalités
        run: |
          if [ -f fonctionnalite1.txt ] && [ -f fonctionnalite2.txt ]; then
            echo "Tous les fichiers sont présents"
          else
            echo "Un ou plusieurs fichiers sont manquants"
            exit 1
          fi